name: Copilot PR Verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: copilot-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.user.login == 'Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Copilot head read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Full test suite
        run: python -m pytest -q
      - name: Critical failure gates
        run: |
          python -m pytest -q -k 'watchdog or failure or gate or policy or reality or buyer or evidence' || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo 'No critical-gate tests selected; full suite already passed.'
            exit 0
          fi
          exit "${code:-0}"
